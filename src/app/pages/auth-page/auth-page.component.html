<section class="card auth-card">
  <h2>Acceso</h2>
  <p class="muted">Inicia sesion o registrate para continuar.</p>

  @if (mode() === 'login') {
    <form (ngSubmit)="submitLogin()" class="stack">
      <input [(ngModel)]="loginForm.username" name="loginUsername" placeholder="username" required />
      <input
        [(ngModel)]="loginForm.password"
        name="loginPassword"
        type="password"
        placeholder="password"
        required
      />
      <button type="submit">Entrar</button>
    </form>
  } @else {
    <form (ngSubmit)="submitRegister()" class="stack">
      <input
        [(ngModel)]="registerForm.username"
        name="registerUsername"
        placeholder="username"
        required
      />
      <input
        [(ngModel)]="registerForm.email"
        name="registerEmail"
        type="email"
        placeholder="email"
        required
      />
      <input
        [(ngModel)]="registerForm.password"
        name="registerPassword"
        type="password"
        placeholder="password"
        required
        minlength="6"
      />
      <button type="submit">Crear cuenta</button>
    </form>
  }

  <div class="switcher">
    <button
      type="button"
      [class.active]="mode() === 'login'"
      (click)="switchMode('login')"
    >
      Iniciar sesion
    </button>
    <button
      type="button"
      [class.active]="mode() === 'register'"
      (click)="switchMode('register')"
    >
      Registrarme
    </button>
  </div>

  @if (message && messageType === 'error') {
    <p class="status" [class.status-error]="messageType === 'error'">{{ message }}</p>
  }
</section>

@if (isSuccessModalOpen) {
  <div class="modal-backdrop" (click)="closeSuccessModal()">
    <section class="modal-card" (click)="$event.stopPropagation()">
      <h3>{{ successModalTitle }}</h3>
      <p>{{ successModalMessage }}</p>
      <div class="row-actions modal-actions">
        <button type="button" (click)="closeSuccessModal()">Continuar</button>
      </div>
    </section>
  </div>
}
