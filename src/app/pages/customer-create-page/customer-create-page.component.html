<section id="create" class="card create-panel">
  <h2>Crear cliente</h2>
  <p class="label">Crear nuevo cliente</p>

  <form (ngSubmit)="submit()" class="stack">
    <label for="customerName">Nombre completo</label>
    <input id="customerName" [(ngModel)]="customerForm.name" name="customerName" placeholder="Nombre completo" required />

    <label for="customerEmail">Correo electronico</label>
    <input id="customerEmail" [(ngModel)]="customerForm.email" name="customerEmail" type="email" placeholder="Correo electronico" required />

    <button type="submit" class="save-btn">Guardar cliente ✓</button>
  </form>

  @if (message) {
    <p class="status" [class.status-error]="messageType === 'error'">{{ message }}</p>
  }
</section>
