<section class="card">
  <div class="card-title">
    <h2>Listado de clientes</h2>
    <button type="button" class="secondary" (click)="load()">Actualizar</button>
  </div>

  @if (message) {
    <p class="warning">{{ message }}</p>
  }

  @if (customers.length === 0) {
    <p class="muted">Aun no hay clientes para mostrar.</p>
  } @else {
    <ul class="customer-list">
      @for (customer of customers; track customer.id) {
        <li>
          @if (editingId === customer.id) {
            <form class="stack" (ngSubmit)="saveEdit(customer.id)">
              <input
                [(ngModel)]="editForm.name"
                name="editName{{ customer.id }}"
                placeholder="Nombre"
                required
              />
              <input
                [(ngModel)]="editForm.email"
                name="editEmail{{ customer.id }}"
                placeholder="Correo"
                type="email"
                required
              />
              <div class="row-actions">
                <button type="submit">Guardar</button>
                <button type="button" class="secondary" (click)="cancelEdit()">Cancelar</button>
              </div>
            </form>
          } @else {
            <strong>{{ customer.name }}</strong>
            <span>{{ customer.email }}</span>
            <div class="row-actions">
              <button type="button" (click)="startEdit(customer)">Editar</button>
              <button type="button" class="secondary" (click)="remove(customer.id)">Eliminar</button>
            </div>
          }
        </li>
      }
    </ul>
  }
</section>
