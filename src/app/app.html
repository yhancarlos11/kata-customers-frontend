<section class="page">
  <header class="hero">
    <h1>Customers App</h1>
    <span class="badge">Entorno: {{ frontendProfile }}</span>
  </header>

  @if (isAuthenticated()) {
    <nav class="main-nav">
      <a routerLink="/customers/create" routerLinkActive="active">Crear cliente</a>
      <a routerLink="/customers/list" routerLinkActive="active">Listar clientes</a>
      <button type="button" class="secondary" (click)="logout()">Cerrar sesion</button>
    </nav>
  } @else {
    <nav class="main-nav">
      <a routerLink="/auth" routerLinkActive="active">Iniciar sesion o registrarme</a>
    </nav>
  }

  <section class="content-slot">
    <router-outlet></router-outlet>
  </section>
</section>
